name: client

on:
  push:
    branches: [main]
    paths:
      - apps/client/**
      - .github/workflows/client.yml
  pull_request:
    paths:
      - apps/client/**
      - .github/workflows/client.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # The bundled FFmpeg links against PulseAudio, VA-API, VDPAU and X11 libraries that the runner image lacks.
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libpulse0 libva2 libva-drm2 libva-x11-2 libvdpau1 libxv1 libxcb-shm0 libxcb-shape0 libxcb-xfixes0
      - uses: gradle/actions/setup-gradle@v6
      # `check` runs ktlint on every source set and the unit tests of all modules.
      - run: ./gradlew check --stacktrace
      # Runs the packaged app image's own jlink runtime (which lacks modules the full JDK has) against SQLite and the
      # FFmpeg natives, so a stale `modules(...)` list in desktopApp/build.gradle.kts fails CI.
      - run: bash desktopApp/packaging/smoke/smoke-test.sh
