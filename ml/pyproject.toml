[project]
name = "snipnet-ml"
version = "0.0.0"
description = "Features, models, evaluation and training for Snipnet rally detection"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.9",
    "av>=14",
    "numpy>=2",
    "pandas>=2.2",
    "pyyaml>=6",
    "librosa>=0.11",
    "torch>=2.5",
    "torchvision>=0.20",
    "scipy>=1.11",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
