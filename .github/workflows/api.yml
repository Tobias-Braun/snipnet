name: api

on:
  push:
    branches: [main]
    paths:
      - services/api/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .prettierrc.json
      - .github/workflows/api.yml
  pull_request:
    paths:
      - services/api/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .prettierrc.json
      - .github/workflows/api.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Integration tests run against a real Postgres, each test file in its own throwaway schema.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snipnet
          # The container is only reachable from this job, so it skips password checks.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: snipnet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snipnet -d snipnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: snipnet
      # Required by the config schema; ignored by the server because of trust authentication.
      PGPASSWORD: unused-with-trust-auth
      PGDATABASE: snipnet
      # Object storage for the upload tests; started in a step below because service containers cannot pass
      # the `server /data` command that MinIO needs. Every test file creates its own bucket.
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: snipnet
      S3_SECRET_KEY: unused-throwaway-secret
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - name: Start MinIO
        working-directory: .
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @snipnet/api...
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: Build the Docker image
        working-directory: .
        run: docker build -f services/api/Dockerfile .
