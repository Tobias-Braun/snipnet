name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            pattern: 'dmg/*.dmg'
          - os: windows-latest
            task: packageMsi
            pattern: 'msi/*.msi'
          - os: ubuntu-latest
            task: packageDeb
            pattern: 'deb/*.deb'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/client
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Each runner builds its own installer, so only the natives of that platform are bundled. The tag (v1.2.3)
      # becomes the installer version; the build script strips the prefix and any pre-release suffix.
      - run: ./gradlew :desktopApp:${{ matrix.task }} -PappVersion="$GITHUB_REF_NAME" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: apps/client/desktopApp/build/compose/binaries/main/${{ matrix.pattern }}
          if-no-files-found: error

  release:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true
      # The installers are unsigned; the release notes say so.
      - run: >
          gh release create "$GITHUB_REF_NAME" installers/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          --notes "Unsigned desktop installers (DMG, MSI, DEB). Your OS may warn before installing."
          --prerelease="$([[ "$GITHUB_REF_NAME" == *-* ]] && echo true || echo false)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
