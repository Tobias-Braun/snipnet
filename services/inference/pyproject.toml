[project]
name = "snipnet-inference"
version = "0.0.0"
description = "Snipnet inference worker: claims jobs from the API, runs the model and posts results"
requires-python = "==3.12.*"
dependencies = ["snipnet-ml"]

[tool.uv.sources]
snipnet-ml = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
