# uv workspace root. It is not a package itself; it only ties the members together so a single `uv sync`
# installs both into one environment and shared tool configuration (ruff, pytest) lives in one place.
[project]
name = "snipnet-workspace"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = ["snipnet-ml", "snipnet-inference"]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["ml", "services/inference"]

[tool.uv.sources]
snipnet-ml = { workspace = true }
snipnet-inference = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps", "node_modules"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["snipnet_ml", "snipnet_inference"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "services/inference/tests"]
# importlib mode lets both members keep plain `tests/` folders without clashing module names.
addopts = ["--import-mode=importlib", "--strict-markers"]
